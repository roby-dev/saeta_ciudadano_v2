name: saeta_ciudadano_v2
description: Saeta Ciudadano - Flutter migration
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_bloc: ^8.1.3
  provider: ^6.1.2
  # Geolocation
  geolocator: ^12.0.0
  # HTTP
  dio: ^5.3.2
  # Navigation
  go_router: ^12.1.1
  # Dependency injection
  get_it: ^7.6.4
  # Secure storage
  flutter_secure_storage: ^9.0.0
  # Functional programming (Either)
  dartz: ^0.10.1
  # Equality
  equatable: ^2.0.5
  # Open the device SMS composer for emergency contact alerts
  url_launcher: ^6.3.0
  # Native device contact picker (no READ_CONTACTS permission required)
  flutter_native_contact_picker: ^0.0.12
  # Realtime updates over Socket.IO (compatible with the backend's
  # socket.io v4 server; the Dart client's v3.x line targets engine.io v4)
  socket_io_client: ^3.1.6
  # Camera/gallery avatar picker (maxWidth/maxHeight/imageQuality keep
  # uploads well under the backend's 5MB /v1/uploads/:id limit)
  image_picker: ^1.2.3
  # Alert detail map (marker at the alert's coordinates, legacy style/zoom).
  # Android: reads the key from android/local.properties (see
  # android/app/build.gradle.kts). iOS: reads it from ios/Flutter/Secrets.xcconfig
  # (git-ignored; see ios/Flutter/Secrets.xcconfig.example).
  google_maps_flutter: ^2.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  bloc_test: ^9.1.4
  mocktail: ^1.0.1
  # Deterministic Timer/Future.delayed control for the T5 backoff-retry tests
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/map_style.json
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
