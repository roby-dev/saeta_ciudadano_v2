name: saeta_ciudadano_v2
description: Saeta Ciudadano - Flutter migration
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_bloc: ^8.1.3
  provider: ^6.1.2
  # Geolocation
  geolocator: ^12.0.0
  # HTTP
  dio: ^5.3.2
  # Navigation
  go_router: ^12.1.1
  # Dependency injection
  get_it: ^7.6.4
  # Secure storage
  flutter_secure_storage: ^9.0.0
  # Functional programming (Either)
  dartz: ^0.10.1
  # Equality
  equatable: ^2.0.5
  # Open the device SMS composer for emergency contact alerts
  url_launcher: ^6.3.0
  # Native device contact picker (no READ_CONTACTS permission required)
  flutter_native_contact_picker: ^0.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  bloc_test: ^9.1.4
  mocktail: ^1.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
